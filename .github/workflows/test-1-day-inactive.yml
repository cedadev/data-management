# This is a test action to see if the 30-days-inactive action works as expected
# For more information, see: https://github.com/actions/stale
name: TEST 1 day inactive

on:
  schedule:
  - cron: '30 1 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has had no activity for 1 day. Update issue to reset timer.'
        stale-issue-label: '1-day-inactive'
        days-before-stale: 1
        days-before-close: -1
        remove-stale-when-updated: true
