name: NERC grant
description: Add a NERC grant.
title: 
labels: ["Project"]
projects: ["cedadev/139"]
assignees: 
body:
  - type: markdown
    attributes:
      value: |
        Fill in the details below to add to the issue now, or leave blank to add later.
  - type: input
    id: abstract
    attributes:
#      label: Project abstract
      description: Short description of the project.
      placeholder: Briefly describe the project
    validations:
      required: false
  - type: input
    id: datamad_link
    attributes:
#      label: DataMad link
      description: Link to DataMad page.
      placeholder: ex. https://datamad.ceda.ac.uk/grant/xxxx
    validations:
      required: false
  - type: input
    id: helpscout_link
    attributes:
#      label: Help Scout link
      description: Link to HelpScout conversation.
      placeholder: ex. https://secure.helpscout.net/conversation/xxxx
    validations:
      required: false
  - type: input
    id: dsw_link
    attributes:
#      label: DSW link
      description: Link to DSW project.
      placeholder: ex. https://nerceds.fair-wizard.com/wizard/projects/xxxx
    validations:
      required: false