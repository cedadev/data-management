# This workflow labels and comments on issues which have had no activity for 30 days

name: 30 days inactive

on:
  schedule:
  - cron: '30 01 * * 1-5'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - uses: actions/stale@v10
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue been inactive for 30 days. Check to see if there are any updates needed.'
        stale-issue-label: '30 days inactive'
        days-before-stale: 30
        days-before-close: -1
        remove-stale-when-updated: true
