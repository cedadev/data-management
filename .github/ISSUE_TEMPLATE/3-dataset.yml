name: Dataset
description: Create a dataset sub-issue.
title: "NERC ID:"
  - Dataset
projects: ["cedadev/139"]

body:
  - type: markdown
    attributes:
      value: |
        ## Dataset Sub-Issue

        Status: **Data due**

  - type: input
    id: dataset_name
    attributes:
      label: Dataset name
      placeholder: Enter dataset name
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Notes
      description: What is known so far about the dataset?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] Dataset scope agreed
        - [ ] Data source identified
        - [ ] Access permissions obtained
        - [ ] Metadata completed
        - [ ] Quality checks performed
        - [ ] Documentation updated
        - [ ] Dataset delivered
    validations:
      required: true
