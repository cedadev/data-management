# This workflow adds the 'Annual check-in due' label
# to issues created 1, 2, and 3 years ago (365, 730, and 1095 days)
# then comments on the issue to notify assignees that the check-in is due

name: Annual check-in label

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-parent:
    if: ${{ github.event.issue.parent_issue_url == null }}
    runs-on: ubuntu-latest

    steps:
      - run: echo "This is a parent issue"
      
  label-issues:
    needs: check-parent
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Add annual check-in label and notify assignees
        uses: actions/github-script@v7
        with:
          script: |
            const checkInDays = [365, 730, 1095];

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            for (const issue of issues) {
              const created = new Date(issue.created_at);
              const now = new Date();

              const ageDays = Math.floor(
                (now.getTime() - created.getTime()) /
                (1000 * 60 * 60 * 24)
              );

              const hasCheckInLabel = issue.labels.some(
                label => label.name === "Annual check-in due"
              );

              const isCheckInDue = checkInDays.some(
                d => ageDays >= d && ageDays < d + 1
              );

              if (isCheckInDue && !hasCheckInLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ["Annual check-in due"]
                });

                const mentions = issue.assignees
                  .map(a => `@${a.login}`)
                  .join(" ");

                if (mentions) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: `👋 ${mentions}, **this project is due an annual check-in**:
                    1. Email the PI using the saved reply.
                    2. Remove the check-in label from this issue.`
                  });
                }

                console.log(
                  `Added label and notified assignees for issue #${issue.number}`
                );
              }
            }
