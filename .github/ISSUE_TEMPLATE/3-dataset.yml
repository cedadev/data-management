name: Dataset
description: Add a dataset.
title: "Add dataset working title"
labels: ["Dataset"]
projects: ["cedadev/139"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in the details below to add to the issue now, or leave blank to add later.
  - type: input
    id: data_contact_name
    attributes:
      label: Contact name
      description: Dataset contact name
      placeholder: ex. Name Surname
    validations:
      required: false
  - type: input
    id: data_contact_email
    attributes:
      label: Datset contact email
      description: Dataset contact email
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: input
    id: dataset_description
    attributes:
      label: Dataset description
      description: Short description of the datset.
      placeholder: ...
    validations:
      required: false
  - type: input
    id: dataset_volume
    attributes:
      label: Dataset volume
      description: Expected volume of the dataset.
      placeholder: ex. 10 TB
    validations:
      required: false