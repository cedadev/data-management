name: Dataset
description: Add a dataset. Only add datasets as sub-issues within a NERC grant or non-NERC project.
title: "<e.g. NERC ref:Working title of dataset>"
labels: ["Dataset"]
projects: ["cedadev/139"]
body:

  - type: markdown
    attributes:
      value: |
        ✨ Create a new dataset sub-issue by adding a title above
        📝 Fill in the details below (or leave as is to edit later)
        🌱 Additional fields are available once the sub-issue is open

  - type: textarea
    attributes:
      label: Issue details
      value: |
        **Dataset contact name:** _<e.g. Contact Name>_
        **Datset contact email:** _<e.g. email@example.com>_
        **File format:** _<e.g. netCDF, BADC-CSV>_
        **Expected volume:** _<e.g. 10TB>_

        **Dataset description:**
        _<Short description of the dataset>_
    validations:
      required: false