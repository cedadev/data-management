# This workflow adds annual check-in labels based on issue creation date and notifies assignees when a label is added

name: annual check-in labels for issues with pre-delivery comms status

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  label-issues:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read
      repository-projects: read

    env:
      PROJECT_ID: ${{ secrets.PROJECT_V2_ID }}

    steps:
      - name: add annual check-in labels and notify assignees
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const checkInDays = [36, 365, 730, 1095];

            const query = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                        content {
                          ... on Issue {
                            repository {
                              owner {
                                login
                              }
                              name
                            }
                            number
                            createdAt
                            labels(first: 100) {
                              nodes {
                                name
                              }
                            }
                            assignees(first: 20) {
                              nodes {
                                login
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              projectId: process.env.PROJECT_ID
            });

            const items = result.node.items.nodes;

            for (const item of items) {

              const status = item.fieldValues.nodes.find(
                field =>
                  field.field?.name === "Status" &&
                  field.name === "Pre-delivery comms"
              );

              if (!status) {
                continue;
              }

              const issue = item.content;

              if (!issue) {
                continue;
              }

              const created = new Date(issue.createdAt);
              const now = new Date();

              const ageDays = Math.floor(
                (now.getTime() - created.getTime()) /
                (1000 * 60 * 60 * 24)
              );

              const hasCheckInLabel = issue.labels.nodes.some(
                label => label.name === "Annual check-in due"
              );

              const isCheckInDue = checkInDays.some(
                d => ageDays >= d && ageDays < d + 1
              );

              if (!isCheckInDue || hasCheckInLabel) {
                continue;
              }

              await github.rest.issues.addLabels({
                owner: issue.repository.owner.login,
                repo: issue.repository.name,
                issue_number: issue.number,
                labels: ["Annual check-in due"]
              });

              const mentions = issue.assignees.nodes
                .map(a => `@${a.login}`)
                .join(" ");

              if (mentions) {
                await github.rest.issues.createComment({
                  owner: issue.repository.owner.login,
                  repo: issue.repository.name,
                  issue_number: issue.number,
                  body: `${mentions}

                  This issue has been labelled \`Annual check-in due\`.`
                });
              }

              console.log(
                `Added label and notified assignees for issue #${issue.number}`
              );
            }
`
