# Adds the 'Annual check-in due' label to parent issues whose
# Actual start date is 1, 2, or 3 years ago (with a 3-day grace period)
# then notifies assignees with a comment

name: Annual check-in label

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  label-issues:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Add annual check-in label and notify assignees
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const PROJECT_NUMBER = 139; // UPDATE IF PROJECT CHANGES
            const ORG_LOGIN = "cedadev"; // UPDATE IF ORG CHANGES
            const LABEL_NAME = "Annual check-in due";

            const CHECK_IN_MESSAGE = (mentions) =>
              `👋 ${mentions}, **this project is due an annual check-in**:
              
              1. Email the PI using the saved reply.
              2. Remove the check-in label from this issue.`;

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let hasNextPage = true;
            let cursor = null;
            const projectItems = [];

            while (hasNextPage) {
              const result = await github.graphql(
                `
                query($org: String!, $project: Int!, $cursor: String) {
                  organization(login: $org) {
                    projectV2(number: $project) {
                      items(first: 100, after: $cursor) {
                        nodes {
                          content {
                            ... on Issue {
                              number
                              state
                              assignees(first: 20) {
                                nodes {
                                  login
                                }
                              }
                              labels(first: 50) {
                                nodes {
                                  name
                                }
                              }
                            }
                          }
                          fieldValues(first: 50) {
                            nodes {
                              ... on ProjectV2ItemFieldDateValue {
                                date
                                field {
                                  ... on ProjectV2FieldCommon {
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }
                }
                `,
                {
                  org: ORG_LOGIN,
                  project: PROJECT_NUMBER,
                  cursor
                }
              );

              const items = result.organization.projectV2.items;

              projectItems.push(...items.nodes);
              hasNextPage = items.pageInfo.hasNextPage;
              cursor = items.pageInfo.endCursor;
            }

            console.log(
              `Retrieved ${projectItems.length} project items`
            );

            for (const item of projectItems) {
              const issue = item.content;

              // Skip non-issue project items
              if (!issue) {
                continue;
              }

              // Skip closed issues
              if (issue.state !== "OPEN") {
                continue;
              }

              const startDateField = item.fieldValues.nodes.find(
                field =>
                  field.field?.name === "Actual start date" &&
                  field.date
              );

              if (!startDateField) {
                continue;
              }

              const hasLabel = issue.labels.nodes.some(
                label => label.name === LABEL_NAME
              );

              if (hasLabel) {
                continue;
              }

              const startDate = new Date(startDateField.date);
              startDate.setHours(0, 0, 0, 0);

              const isDue = [1, 2, 3].some(years => {
                const anniversary = new Date(startDate);

                anniversary.setFullYear(
                  anniversary.getFullYear() + years
                );

                const diffDays = Math.floor(
                  (today.getTime() -
                    anniversary.getTime()) /
                  (1000 * 60 * 60 * 24)
                );

                return diffDays >= 0 && diffDays <= 3;
              });

              if (!isDue) {
                continue;
              }

              // Parent issues only
              // Check only candidate issues to minimise API calls
              const issueDetails =
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number
                });

              if (issueDetails.data.parent_issue_url) {
                console.log(
                  `Skipping sub-issue #${issue.number}`
                );
                continue;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [LABEL_NAME]
              });

              const mentions = issue.assignees.nodes
                .map(a => `@${a.login}`)
                .join(" ");

              if (mentions) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: CHECK_IN_MESSAGE(mentions)
                });
              }

              console.log(
                `Added label and notified assignees for issue #${issue.number}`
              );
            }
