name: Dataset
description: Create a dataset sub-issue
title: "<NERC ID: Working dataset title>"
labels:
  - Dataset

body:
  - type: markdown
    attributes:
      value: |
        ## Dataset Sub-Issue

        **Status:** Data due

  - type: input
    id: dataset_name
    attributes:
      label: Dataset name
      placeholder: Enter dataset name
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the dataset and its purpose.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Mandatory checklist

        - [ ] Dataset scope agreed
        - [ ] Data source identified
        - [ ] Access permissions obtained
        - [ ] Metadata completed
        - [ ] Quality checks performed
        - [ ] Documentation updated
        - [ ] Dataset delivered
``
