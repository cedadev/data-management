# This workflow adds the 'End date passed' label to issues 
# when the 'Actual end date' has passed (within a 3 day grace period),
# then comments on the issue to notify assignees

name: End date passed label

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check-parent:
    if: ${{ github.event.issue.parent_issue_url == null }}
    runs-on: ubuntu-latest

    steps:
      - run: echo "This is a parent issue"
  
  label-issues:
    needs: check-parent
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - name: Add End date passed label and notify assignees
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const PROJECT_NUMBER = 139; // UPDATE THIS IF PROJECT IS CHANGED
            const ORG_LOGIN = "cedadev"; // UPDATE THIS IF ORG IS CHANGED

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Get all open issues in the repository
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
            );

            const issueMap = new Map(
              issues.map(issue => [issue.number, issue])
            );

            // Retrieve all project items using GraphQL pagination
            let hasNextPage = true;
            let cursor = null;
            const projectItems = [];

            while (hasNextPage) {
              const result = await github.graphql(
                `
                query($org: String!, $project: Int!, $cursor: String) {
                  organization(login: $org) {
                    projectV2(number: $project) {
                      items(first: 100, after: $cursor) {
                        nodes {
                          content {
                            ... on Issue {
                              number
                            }
                          }
                          fieldValues(first: 50) {
                            nodes {
                              ... on ProjectV2ItemFieldDateValue {
                                date
                                field {
                                  ... on ProjectV2FieldCommon {
                                    name
                                  }
                                }
                              }
                            }
                          }
                        }
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                      }
                    }
                  }
                }
                `,
                {
                  org: ORG_LOGIN,
                  project: PROJECT_NUMBER,
                  cursor
                }
              );

              const items =
                result.organization.projectV2.items;

              projectItems.push(...items.nodes);

              hasNextPage = items.pageInfo.hasNextPage;
              cursor = items.pageInfo.endCursor;
            }

            console.log(
              `Retrieved ${projectItems.length} project items`
            );

            for (const item of projectItems) {

              const issueNumber = item.content?.number;

              // Skip non-issue project items
              if (!issueNumber) {
                continue;
              }

              const issue = issueMap.get(issueNumber);

              // Skip closed issues or issues not in this repository
              if (!issue) {
                continue;
              }

              const endDateField = item.fieldValues.nodes.find(
                field =>
                  field.field?.name === "Actual end date" &&
                  field.date
              );

              if (!endDateField) {
                continue;
              }

              const endDate = new Date(endDateField.date);
              endDate.setHours(0, 0, 0, 0);

              // Actual end date has passed
              const isDue = endDate <= today;

              const hasLabel = issue.labels.some(
                label => label.name === "End date passed"
              );

              if (!isDue || hasLabel) {
                continue;
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["End date passed"]
              });

              const mentions = issue.assignees
                .map(a => `@${a.login}`)
                .join(" ");

              if (mentions) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `👋 ${mentions}, **please check if this project is due its data delivery check-in**:
                    1. Check that _Actual end date_ matches in GitHub and DataMad.
                    2. If the dates match, email the PI using the saved reply template. Otherwise, update the date in GitHub.
                    3. Remove the check-in label from this issue.`
                });
              }

              console.log(
                `Added End date passed label and notified assignees for issue #${issue.number}`
              );
            }
