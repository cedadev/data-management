# This workflow checks for due reminders and posts a comment to notify issue assignees

name: post reminder

on:
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: check for due reminders and notify
        uses: agrc/reminder-action@v1
