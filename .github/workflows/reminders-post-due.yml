# This workflow checks for due reminders and posts a comment to notify issue assignees

name: post due reminder

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: check for due reminders and post a comment
        uses: agrc/reminder-action@v1
